<!-- DATA CLOUD 101 PRACTICE APP -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0d1117; --surface:#161c27; --surface-2:#1c2532; --line:#27303f;
    --ink:#e8edf4; --muted:#93a0b4; --faint:#6b7689;
    --accent:#4d8dff; --accent-soft:#1f3052;
    --ok:#3ddc97; --ok-soft:#143226; --bad:#ff6b6b; --bad-soft:#3a1d22;
    --flag:#ffc24b; --flag-soft:#3a2f15;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:0; min-height:100vh;
  }
  .wrap{max-width:840px; margin:0 auto; padding:28px 20px 80px}
  a{color:var(--accent)}
  button{font-family:inherit}
  .hide{display:none !important}

  /* ---- header ---- */
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
  .brand{display:flex; flex-direction:column; gap:2px}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
  h1{font-size:23px; margin:0; font-weight:650; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:13px}
  .mastery{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right; white-space:nowrap}
  .mastery b{color:var(--ink)}

  /* ---- menu cards ---- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; cursor:pointer; transition:border-color .15s, transform .15s, background .15s;
    display:flex; flex-direction:column; gap:8px; text-align:left;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-2px)}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .card .num{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.12em}
  .card h3{margin:0; font-size:16px; font-weight:620}
  .card p{margin:0; color:var(--muted); font-size:13px}
  .card .badge{font-family:var(--mono); font-size:11px; color:var(--accent); margin-top:2px}

  .opts{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; transition:.12s;
    font-family:var(--mono);
  }
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
  .chip:hover{border-color:var(--accent)}
  .config{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-top:16px}
  .config h3{margin:0 0 4px; font-size:15px}
  .config .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px}
  .config label{font-size:13px; color:var(--muted); min-width:70px}

  .btn{
    background:var(--accent); color:#06101f; border:none; border-radius:10px;
    padding:11px 20px; font-size:14px; font-weight:650; cursor:pointer; transition:.12s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent); color:var(--ink)}
  .btn:disabled{opacity:.4; cursor:not-allowed}

  /* ---- quiz ---- */
  .quizbar{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
  .progress{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; min-width:120px}
  .progress > i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s}
  .counter{font-family:var(--mono); font-size:13px; color:var(--muted)}
  .timer{font-family:var(--mono); font-size:13px; color:var(--ink); background:var(--surface-2); padding:4px 10px; border-radius:8px}
  .timer.low{color:var(--bad)}

  .qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px}
  .qmeta{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
  .qtag{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em}
  .selecthint{font-family:var(--mono); font-size:11px; color:var(--flag); letter-spacing:.04em}
  .qtext{font-size:16.5px; font-weight:560; margin:0 0 18px; line-height:1.5}
  .flagbtn{background:none; border:1px solid var(--line); color:var(--faint); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; font-family:var(--mono)}
  .flagbtn[aria-pressed="true"]{color:var(--flag); border-color:var(--flag); background:var(--flag-soft)}

  .answers{display:flex; flex-direction:column; gap:10px}
  .ans{
    display:flex; gap:12px; align-items:flex-start; padding:13px 15px;
    border:1px solid var(--line); border-radius:11px; background:var(--surface-2);
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .ans:hover{border-color:var(--accent)}
  .ans .key{
    font-family:var(--mono); font-size:13px; font-weight:600; color:var(--muted);
    border:1px solid var(--line); border-radius:7px; min-width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-top:1px;
  }
  .ans .body{font-size:14.5px; flex:1}
  .ans[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .ans[aria-checked="true"] .key{border-color:var(--accent); color:var(--ink); background:var(--accent)}
  /* graded states */
  .ans.correct{border-color:var(--ok); background:var(--ok-soft)}
  .ans.correct .key{border-color:var(--ok); color:#06101f; background:var(--ok)}
  .ans.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .ans.wrong .key{border-color:var(--bad); color:#fff; background:var(--bad)}
  .ans.locked{cursor:default}
  .ans.locked:hover{border-color:inherit}
  .mark{margin-left:auto; font-family:var(--mono); font-size:12px; align-self:center}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}

  .feedback{margin-top:16px; font-size:13.5px; padding:11px 14px; border-radius:10px; display:none}
  .feedback.show{display:block}
  .feedback.good{background:var(--ok-soft); color:var(--ok)}
  .feedback.poor{background:var(--bad-soft); color:#ffb3b3}

  .navrow{display:flex; gap:10px; margin-top:18px; align-items:center}
  .navrow .spacer{flex:1}
  .kbd{font-family:var(--mono); font-size:11px; color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:1px 6px}

  /* ---- results ---- */
  .result{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px; text-align:center}
  .score{font-size:54px; font-weight:700; font-family:var(--mono); letter-spacing:-.02em; margin:6px 0}
  .score.pass{color:var(--ok)} .score.fail{color:var(--bad)}
  .verdict{font-size:15px; color:var(--muted)}
  .verdict b{color:var(--ink)}
  .breakdown{display:flex; justify-content:center; gap:26px; margin:20px 0; flex-wrap:wrap}
  .breakdown div{font-family:var(--mono); font-size:13px; color:var(--muted)}
  .breakdown b{display:block; font-size:22px; color:var(--ink)}

  /* ---- browse ---- */
  .search{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px 14px; font-size:14px; margin-bottom:14px; font-family:inherit}
  .search:focus{outline:none; border-color:var(--accent)}
  .browseq{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px}
  .browseq .qn{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.1em}
  .browseq .bq{font-size:15px; font-weight:560; margin:6px 0 12px}
  .browseq .ba{font-size:14px; padding:8px 12px; border-radius:8px; margin-bottom:6px; display:flex; gap:10px; background:var(--surface-2); border:1px solid var(--line)}
  .browseq .ba .bk{font-family:var(--mono); color:var(--faint); flex:0 0 auto}
  .browseq .ba.right{background:var(--ok-soft); border-color:var(--ok)}
  .browseq .ba.right .bk{color:var(--ok)}
  .empty{color:var(--muted); text-align:center; padding:40px; font-size:14px}
  footer.foot{margin-top:34px; text-align:center; color:var(--faint); font-size:12px; font-family:var(--mono)}
</style>

<script type="application/json" id="qdata">[{"num": 1, "q": "Which statement is true related to batch ingestions from Salesforce CRM?", "answers": [{"letter": "A", "text": "When a column is added or removed, the CRM connector performs a full refresh.", "correct": true}, {"letter": "B", "text": "The CRM connector performs an incremental refresh when 600K or more deletion records are detected.", "correct": false}, {"letter": "C", "text": "The CRM connector's synchronization times can be customized to up to 15-minute intervals.", "correct": false}, {"letter": "D", "text": "CRM data cannot be manually refreshed and must wait for the next scheduled synchronization.", "correct": false}], "correct": ["A"]}, {"num": 2, "q": "When trying to disconnect a data source an error will be generated if it has which two dependencies associated with it? Choose 2 answers", "answers": [{"letter": "A", "text": "Activation", "correct": false}, {"letter": "B", "text": "Data stream", "correct": true}, {"letter": "C", "text": "Segment", "correct": true}, {"letter": "D", "text": "Activation target", "correct": false}], "correct": ["B", "C"]}, {"num": 3, "q": "A consultant is preparing to implement Data Cloud. Which ethic should the consultant adhere to regarding customer data?", "answers": [{"letter": "A", "text": "Allow senior leaders in the firm to access customer data for audit purposes.", "correct": false}, {"letter": "B", "text": "Collect and use all of the data to create more personalized experiences.", "correct": false}, {"letter": "C", "text": "Map sensitive data to the same DMO for ease of deletion.", "correct": false}, {"letter": "D", "text": "Carefully consider asking for sensitive data such as age, gender, or ethnicity.", "correct": true}], "correct": ["D"]}, {"num": 4, "q": "A financial services firm specializing in wealth management contacts a Data Cloud consultant with an identity resolution request. The company wants to enhance its strategy to better manage individual client profiles within family portfolios. Family members often share addresses and sometimes phone numbers but have distinct investment preferences and financial goals. The firm aims to avoid blending individual family profiles into a single entity to maintain personalized service and accurate financial advice. Which identity resolution strategy should the consultant put in place?", "answers": [{"letter": "A", "text": "Configure a single match rule with a single connected contact point based on address.", "correct": false}, {"letter": "B", "text": "Use multiple contact points without individual attributes in the match rules.", "correct": false}, {"letter": "C", "text": "Use a more restrictive design approach to ensure the match rules perform as desired.", "correct": true}, {"letter": "D", "text": "Configure a single match rule based on a custom identifier.", "correct": false}], "correct": ["C"]}, {"num": 5, "q": "A rideshare company wants to send an email to customers that provides a year-in-review with five 'fun' trip statistics, such as destination, distance traveled, etc. This raw data arrives into Data Cloud and is not aggregated at source. The company creates a segment of customers that had at least one ride in the last 365 days. Following best practices, which solution should the consultant recommend in Data Cloud to personalize the content of the email?", "answers": [{"letter": "A", "text": "Use a data transform to aggregate the statistics and map them to direct attributes on Individual to include in the activation.", "correct": true}, {"letter": "B", "text": "Create five calculated insights for the activation and add dimension filters.", "correct": false}, {"letter": "C", "text": "Use a data action to send each ride as an event to Marketing Cloud Engagement, then use AMP script to summarize this data in the email.", "correct": false}, {"letter": "D", "text": "Include related attributes in the activation for the last 365 days.", "correct": false}], "correct": ["A"]}, {"num": 6, "q": "Northern Trail Outfitters uploads new customer data to an Amazon S3 Bucket on a daily basis to be ingested in Data Cloud. Based on this, a calculated insight is created that shows the total spend per customer in the last 30 days. In which sequence should each process be run to ensure that freshly imported data is ready and available to use for any segment?", "answers": [{"letter": "A", "text": "Refresh Data Stream > Identity Resolution > Calculated Insight", "correct": true}, {"letter": "B", "text": "Refresh Data Stream > Calculated Insight > Identity Resolution", "correct": false}, {"letter": "C", "text": "Calculated Insight > Refresh Data Stream > Identity Resolution", "correct": false}, {"letter": "D", "text": "Identity Resolution > Refresh Data Stream > Calculated Insight", "correct": false}], "correct": ["A"]}, {"num": 7, "q": "An automotive dealership wants to implement Data Cloud. What is a use case for Data Cloud's capabilities?", "answers": [{"letter": "A", "text": "Implement a full archive solution with version management.", "correct": false}, {"letter": "B", "text": "Use browser cookies to track visitor activity on the website and display personalized recommendations.", "correct": false}, {"letter": "C", "text": "Build a source of truth for consent management across all unified individuals.", "correct": false}, {"letter": "D", "text": "Ingest customer interaction across different touch points, harmonize, and build a data model for analytical reporting.", "correct": true}], "correct": ["D"]}, {"num": 8, "q": "Northern Trail Outfitters (NTO) owns and operates six unique brands, each with their own set of customers, transactions, and loyalty information. The marketing director wants to ensure that segments and activations from the NTO Outlet brand do not reference customers or transactions from the other brands. What is the most efficient approach to handle this requirement?", "answers": [{"letter": "A", "text": "Use Business Unit Aware activation.", "correct": false}, {"letter": "B", "text": "Separate the Outlet brand into a data space.", "correct": true}, {"letter": "C", "text": "Separate the brands into six different data spaces.", "correct": false}, {"letter": "D", "text": "Create a batch data transform to generate a DLO for the Outlet brand.", "correct": false}], "correct": ["B"]}, {"num": 9, "q": "An analyst from Cloud Kicks needs to get quick Insights to determine the average sales per day during the past week. What should a consultant recommend?", "answers": [{"letter": "A", "text": "salesforce flows", "correct": false}, {"letter": "B", "text": "Lightning web component utilizing Query API", "correct": false}, {"letter": "C", "text": "Salesforce reports", "correct": true}, {"letter": "D", "text": "Segment activation to Azure", "correct": false}], "correct": ["C"]}, {"num": 10, "q": "Northern Trail Outfitters wants to create a segment with customers that have purchased in the last 24 hours. The segment data must be as up to date as possible. What should the consultant Implement when creating the segment?", "answers": [{"letter": "A", "text": "Use streaming insights for near real-time segmentation results.", "correct": true}, {"letter": "B", "text": "Use Einstein segmentation optimization to collect data from the last 24 hours.", "correct": false}, {"letter": "C", "text": "Use rapid segments with a publish interval of 1 hour.", "correct": false}, {"letter": "D", "text": "Use standard segment with a publish interval of 30 minutes.", "correct": false}], "correct": ["A"]}, {"num": 11, "q": "A consultant needs to create a data graph based on several DLOs, Which step should the consultant take to make this work?", "answers": [{"letter": "A", "text": "Use a data action to update the data graph with the DLO data", "correct": false}, {"letter": "B", "text": "Map the DLOS to DMOS and use these in the data graph.", "correct": true}, {"letter": "C", "text": "Map the DLOs directly to a data graph.", "correct": false}, {"letter": "D", "text": "Batch transform the DLOs to multiple DMOs and activate these with the data graph.", "correct": false}], "correct": ["B"]}, {"num": 12, "q": "What is a typical use case for Salesforce Data Cloud?", "answers": [{"letter": "A", "text": "Data synchronization across the Salesforce ecosystem", "correct": false}, {"letter": "B", "text": "Storing CRM data on promises", "correct": false}, {"letter": "C", "text": "Data harmonization across multiple platforms", "correct": true}, {"letter": "D", "text": "Sending personalized emails at scale", "correct": false}], "correct": ["C"]}, {"num": 13, "q": "The marketing manager at Cloud Kicks plans to bring in corporate phone numbers for its accounts into Data Cloud. They plan to use a custom field with data set to Phone to store these phone numbers. Which statement is true when ingesting phone numbers?", "answers": [{"letter": "A", "text": "Text value can be accepted for ingestion into = phone data type field.", "correct": true}, {"letter": "B", "text": "Data Cloud validates the format of the phone number at the time of Ingestion.", "correct": false}, {"letter": "C", "text": "The phone number field car only accept 10-digit values.", "correct": false}, {"letter": "D", "text": "The phone number field should be used as a primary key.", "correct": false}], "correct": ["A"]}, {"num": 14, "q": "A marketing manager at Northern Trail Outfitters wants to Improve marketing return on investment (ROI) by tapping into Insights from Data Cloud Segment Intelligence. Which permission set does a user need to set this up?", "answers": [{"letter": "A", "text": "Data Cloud Data Aware Specialist", "correct": false}, {"letter": "B", "text": "Data Cloud User", "correct": false}, {"letter": "C", "text": "Cloud Marketing Manager", "correct": false}, {"letter": "D", "text": "Data Cloud Admin", "correct": true}], "correct": ["D"]}, {"num": 15, "q": "A consultant wants to confirm the Identity resolution they Just set up. Which two features can the consultant use to validate the data on a unified profile? Choose 2 answers", "answers": [{"letter": "A", "text": "Identity Resolution", "correct": false}, {"letter": "B", "text": "Data Actions", "correct": false}, {"letter": "C", "text": "Data Explorer", "correct": true}, {"letter": "D", "text": "Query API", "correct": true}], "correct": ["C", "D"]}, {"num": 16, "q": "A customer creates a large segment of customers that placed orders in the last 30 days, and adds related attributes from the... to the activation. Upon checking the activation in Marketing Cloud, they notice It contains orders that are older than 30 days. What should a consultant do to resolve this issue?", "answers": [{"letter": "A", "text": "use data graphs that contain only 30 days of data.", "correct": false}, {"letter": "B", "text": "Apply a data space fitter to exclude orders older than 30 days.", "correct": false}, {"letter": "C", "text": "Apply a filter to Purchase Order Date to exclude orders older than 30 days.", "correct": true}, {"letter": "D", "text": "Use SQL in Marketing Cloud Engagement to remove orders older than 30 days.", "correct": false}], "correct": ["C"]}, {"num": 17, "q": "A consultant at Northern Trail Outfitters is implementing Data Cloud and creating an activation target for their segment. For activation membership, which object should the consultant choose?", "answers": [{"letter": "A", "text": "Data Model Object", "correct": false}, {"letter": "B", "text": "Data Activation Object", "correct": false}, {"letter": "C", "text": "Data Segmentation Object", "correct": true}, {"letter": "D", "text": "Data Lake Object", "correct": false}], "correct": ["C"]}, {"num": 18, "q": "Cumulus Financial is experiencing delays in publishing multiple segments simultaneously. The company wants to avoid reducing the frequency at which segments are published, while retaining the same segments in place today. Which action should a consultant take to alleviate this issue?", "answers": [{"letter": "A", "text": "Enable rapid segment publishing to all to segment to reduce generation time.", "correct": false}, {"letter": "B", "text": "Reduce the number of segments being published.", "correct": false}, {"letter": "C", "text": "Increase the Data Cloud segmentation concurrency limit.", "correct": true}, {"letter": "D", "text": "Adjust the publish schedule start time of each segment to prevent overlapping processes.", "correct": false}], "correct": ["C"]}, {"num": 19, "q": "A consultant is setting up Data Cloud for a multi-brand organization and is using data spaces to segregate its data for various brands. While starting the mapping of a data stream, the consultant notices that they cannot map the object for one of the brands. What should the consultant do to make the object available for a new data space?", "answers": [{"letter": "A", "text": "Create a new data stream and map the second data stream to the data space.", "correct": false}, {"letter": "B", "text": "Copy data from the default data space to a new DMO using the Data Copy feature and link this DMO to the new data space.", "correct": false}, {"letter": "C", "text": "Create a batch transform to split data between different data spaces.", "correct": false}, {"letter": "D", "text": "Navigate to the Data Space tab and select the object to be included in the new data space.", "correct": true}], "correct": ["D"]}, {"num": 20, "q": "Cumulus Financial segregates its sales CRM data based on Region for its Data Cloud users. Multiple data spaces are configured: a default space and two additional spaces tailored for EMEA and APAC regions. EME A sales reps who need temporary access to visualize data for both regions say that they cannot visualize APAC data. APAC sales reps can visualize the corresponding segmented data. Which statement describes the cause of this issue?", "answers": [{"letter": "A", "text": "The EMEA sales reps have not been assigned to the profile associated with the APAC data space.", "correct": false}, {"letter": "B", "text": "The APAC data space is not associated with any permission set.", "correct": false}, {"letter": "C", "text": "The APAC data space Is not associated with any profile.", "correct": false}, {"letter": "D", "text": "The EMEA sales reps have not been assigned to the permission set associated with the APAC data space.", "correct": true}], "correct": ["D"]}, {"num": 21, "q": "What is a key functionality of Data Cloud?", "answers": [{"letter": "A", "text": "To create a master data management (MUM) strategy", "correct": false}, {"letter": "B", "text": "To give a persistent ID for unified profiles", "correct": false}, {"letter": "C", "text": "To build insights on unified profiles", "correct": true}, {"letter": "D", "text": "To help users build a heat map using their data", "correct": false}], "correct": ["C"]}, {"num": 22, "q": "Which data stream category type should be assigned in order to use the dataset for date and time-based operations in segmentation and calculated insights?", "answers": [{"letter": "A", "text": "Individual", "correct": false}, {"letter": "B", "text": "Engagement", "correct": true}, {"letter": "C", "text": "Sales Order", "correct": false}, {"letter": "D", "text": "Profile", "correct": false}], "correct": ["B"]}, {"num": 23, "q": "What is a reason to create a formula when ingesting a data stream?", "answers": [{"letter": "A", "text": "To concatenate files so they are ingested in the correct sequence", "correct": false}, {"letter": "B", "text": "To add a unique external identifier to an existing ruleset", "correct": false}, {"letter": "C", "text": "To transform is date time field into a dale field for use in data mapping", "correct": true}, {"letter": "D", "text": "To remove duplicate rows of data from the data stream", "correct": false}], "correct": ["C"]}, {"num": 24, "q": "A global fashion retailer operates online sales platforms across AMFR, FMFA, and APAC. the data formats for customer, order, and pro }, {"letter": "C", "text": "Refersh data stream > Calculated Inshight > identit Res", "correct": false}, {"letter": "D", "text": "Identity Res > Calcualted insight > refresh data stream", "correct": false}], "correct": ["A"]}, {"num": 217, "q": "A retail customer wants to bring customer data from different sources and wants to take advantage of identity resolution so that I can be used in segmentation. On which entity should this be segmented for action membershiop", "answers": [{"letter": "A", "text": "Unified individual", "correct": true}, {"letter": "B", "text": "individual", "correct": false}, {"letter": "C", "text": "unified contact", "correct": false}, {"letter": "D", "text": "subscriber", "correct": false}], "correct": ["A"]}, {"num": 218, "q": "How can attribute names be modified to match a naming convention in cloud file storage target", "answers": [{"letter": "A", "text": "update field names in the data model", "correct": false}, {"letter": "B", "text": "use formula field to update the field name in a activation", "correct": false}, {"letter": "C", "text": "update attribute names in the data stream configuration", "correct": false}, {"letter": "D", "text": "set preferred attribute names when configuring activation", "correct": true}], "correct": ["D"]}]</script>
<script>
const QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
const TOTAL = QUESTIONS.length;
const PASS_PCT = 62; // Salesforce Data Cloud Consultant passing score

/* ---------- persistence ---------- */
let STATS = {};   // qnum -> {seen, correct, wrong, last}
let FLAGGED = {}; // qnum -> true
const KEY_STATS='dc101:stats', KEY_FLAG='dc101:flagged';
async function loadStore(){
  try{ const s=localStorage.getItem(KEY_STATS); if(s) STATS=JSON.parse(s);}catch(e){}
  try{ const f=localStorage.getItem(KEY_FLAG); if(f) FLAGGED=JSON.parse(f);}catch(e){}
}
async function saveStats(){ try{ localStorage.setItem(KEY_STATS, JSON.stringify(STATS)); }catch(e){} }
async function saveFlags(){ try{ localStorage.setItem(KEY_FLAG, JSON.stringify(FLAGGED)); }catch(e){} }
function recordResult(qnum, correct){
  const s = STATS[qnum] || {seen:0,correct:0,wrong:0,last:null};
  s.seen++; if(correct){s.correct++; s.last='correct';} else {s.wrong++; s.last='wrong';}
  STATS[qnum]=s; saveStats();
}
function masteredCount(){ return QUESTIONS.filter(q=>STATS[q.num] && STATS[q.num].last==='correct').length; }
function updateMastery(){
  const m=masteredCount();
  document.getElementById('mastery').innerHTML =
    `<b>${m}</b> / ${TOTAL} mastered &nbsp;·&nbsp; <b>${Object.keys(FLAGGED).length}</b> flagged`;
}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const app=$('#app');

/* ---------- menu ---------- */
function renderMenu(){
  updateMastery();
  app.innerHTML = `
    <div class="grid">
      <button class="card" data-go="practice">
        <span class="num">MODE 01</span>
        <h3>Practice</h3>
        <p>Immediate feedback after each question. The fastest way to learn the bank.</p>
        <span class="badge">choose length below ↓</span>
      </button>
      <button class="card" data-go="exam">
        <span class="num">MODE 02</span>
        <h3>Mock exam</h3>
        <p>Timed, no feedback until you submit. Scored against the ${PASS_PCT}% pass line.</p>
        <span class="badge">60 Q · 105 min</span>
      </button>
      <button class="card" data-go="missed">
        <span class="num">MODE 03</span>
        <h3>Focus on weak spots</h3>
        <p>Only questions you got wrong, flagged, or haven't seen yet.</p>
        <span class="badge" id="weakcount"></span>
      </button>
      <button class="card" data-go="browse">
        <span class="num">MODE 04</span>
        <h3>Browse &amp; review</h3>
        <p>Read every question with the answer shown. Search by keyword or number.</p>
        <span class="badge">all ${TOTAL} answers visible</span>
      </button>
    </div>

    <div class="config">
      <h3>Practice settings</h3>
      <p class="sub" style="margin:4px 0 0">Used when you start Practice or Focus mode.</p>
      <div class="row">
        <label>Length</label>
        <span class="chip" data-len="10">10</span>
        <span class="chip" data-len="20" aria-pressed="true">20</span>
        <span class="chip" data-len="40">40</span>
        <span class="chip" data-len="0">All</span>
      </div>
      <div class="row">
        <label>Order</label>
        <span class="chip" data-order="shuffle" aria-pressed="true">Shuffle</span>
        <span class="chip" data-order="seq">In order</span>
      </div>
    </div>

    <div class="config" style="margin-top:14px">
      <h3>Reset</h3>
      <p class="sub" style="margin:4px 0 12px">Clear saved scores and flags on this device.</p>
      <button class="btn ghost" id="resetbtn">Reset all progress</button>
    </div>
  `;

  const weak = weakPool().length;
  $('#weakcount').textContent = weak ? `${weak} to review` : 'all caught up ✓';

  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const go=b.dataset.go;
    if(go==='practice') startQuiz('practice');
    else if(go==='exam') startExam();
    else if(go==='missed') startQuiz('missed');
    else if(go==='browse') renderBrowse();
  });
  app.querySelectorAll('[data-len]').forEach(c=>c.onclick=()=>{
    app.querySelectorAll('[data-len]').forEach(x=>x.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true'); CFG.len=+c.dataset.len;
  });
  app.querySelectorAll('[data-order]').forEach(c=>c.onclick=()=>{
    app.querySelectorAll('[data-order]').forEach(x=>x.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true'); CFG.order=c.dataset.order;
  });
  $('#resetbtn').onclick=async()=>{
    if(!confirm('Clear all saved scores and flags?')) return;
    STATS={}; FLAGGED={}; await saveStats(); await saveFlags(); renderMenu();
  };
}
const CFG={len:20, order:'shuffle'};

function weakPool(){
  return QUESTIONS.filter(q=>{
    if(FLAGGED[q.num]) return true;
    const s=STATS[q.num];
    return !s || s.last==='wrong';
  });
}

/* ---------- quiz engine ---------- */
let Q=null; // current session
function buildPool(type){
  let base;
  if(type==='missed'){ base = weakPool(); if(!base.length) base=QUESTIONS; }
  else base = QUESTIONS;
  let pool = CFG.order==='shuffle' ? shuffle(base) : base.slice().sort((a,b)=>a.num-b.num);
  if(CFG.len>0) pool=pool.slice(0,CFG.len);
  return pool;
}
function startQuiz(type){
  const pool=buildPool(type);
  Q={type, mode:type==='exam'?'exam':'practice', pool, idx:0, sel:{}, checked:{}};
  renderQuestion();
}
function startExam(){
  const pool=shuffle(QUESTIONS).slice(0,60);
  Q={type:'exam', mode:'exam', pool, idx:0, sel:{}, checked:{}, deadline:Date.now()+105*60*1000};
  startTimer();
  renderQuestion();
}
let timerInt=null;
function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const el=$('#timer'); if(!el) return;
    let left=Math.max(0, Q.deadline-Date.now());
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    el.textContent=`${m}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('low', left<5*60000);
    if(left<=0){ clearInterval(timerInt); finishExam(); }
  },500);
}

function curQ(){ return Q.pool[Q.idx]; }
function selSet(qnum){ return Q.sel[qnum] || (Q.sel[qnum]=[]); }

function renderQuestion(){
  const q=curQ(); const isMulti=q.correct.length>1;
  const sel=selSet(q.num);
  const checked = Q.checked[q.num];
  const showTimer = Q.mode==='exam';
  app.innerHTML=`
    <div class="quizbar">
      <button class="btn ghost" id="quit" style="padding:6px 12px">‹ Menu</button>
      <div class="progress"><i style="width:${(Q.idx/Q.pool.length*100)}%"></i></div>
      <span class="counter">${Q.idx+1} / ${Q.pool.length}</span>
      ${showTimer?`<span class="timer" id="timer">105:00</span>`:``}
    </div>
    <div class="qcard">
      <div class="qmeta">
        <span class="qtag">QUESTION ${q.num}${isMulti?` · SELECT ${q.correct.length}`:``}</span>
        <button class="flagbtn" id="flag" aria-pressed="${!!FLAGGED[q.num]}">⚑ ${FLAGGED[q.num]?'Flagged':'Flag'}</button>
      </div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="navrow">
        <button class="btn ghost" id="prev" ${Q.idx===0?'disabled':''}>‹ Prev</button>
        <div class="spacer"></div>
        ${Q.mode==='practice' && !checked
          ? `<button class="btn" id="check" ${sel.length?'':'disabled'}>Check answer</button>`
          : ''}
        <button class="btn" id="next">${Q.idx===Q.pool.length-1 ? (Q.mode==='exam'?'Submit exam':'Finish') : 'Next ›'}</button>
      </div>
    </div>
  `;
  const ansBox=$('#answers');
  q.answers.forEach(a=>{
    const div=document.createElement('div');
    div.className='ans'+(checked?' locked':'');
    const picked=sel.includes(a.letter);
    div.setAttribute('aria-checked', picked?'true':'false');
    div.dataset.letter=a.letter;
    div.innerHTML=`<span class="key">${a.letter}</span><span class="body">${esc(a.text)}</span>`;
    if(checked){
      if(a.correct){ div.classList.add('correct'); div.insertAdjacentHTML('beforeend','<span class="mark ok">correct</span>'); }
      else if(picked){ div.classList.add('wrong'); div.insertAdjacentHTML('beforeend','<span class="mark bad">your pick</span>'); }
    } else {
      div.onclick=()=>toggle(q,a.letter,isMulti);
    }
    ansBox.appendChild(div);
  });
  if(checked) showFeedback(q);

  $('#quit').onclick=leaveQuiz;
  $('#prev').onclick=()=>{ if(Q.idx>0){Q.idx--; renderQuestion();} };
  $('#next').onclick=advance;
  $('#flag').onclick=async(e)=>{
    if(FLAGGED[q.num]) delete FLAGGED[q.num]; else FLAGGED[q.num]=true;
    await saveFlags();
    e.currentTarget.setAttribute('aria-pressed', !!FLAGGED[q.num]);
    e.currentTarget.innerHTML=`⚑ ${FLAGGED[q.num]?'Flagged':'Flag'}`;
  };
  const chk=$('#check'); if(chk) chk.onclick=()=>checkAnswer(q);
}

function toggle(q,letter,isMulti){
  if(Q.checked[q.num]) return;
  const sel=selSet(q.num);
  if(isMulti){
    const i=sel.indexOf(letter);
    if(i>=0) sel.splice(i,1); else sel.push(letter);
  } else {
    Q.sel[q.num]=[letter];
  }
  // re-render answer states only
  $('#answers').querySelectorAll('.ans').forEach(d=>{
    d.setAttribute('aria-checked', Q.sel[q.num].includes(d.dataset.letter)?'true':'false');
  });
  const chk=$('#check'); if(chk) chk.disabled = !Q.sel[q.num].length;
}

function isCorrect(q){
  const sel=[...(Q.sel[q.num]||[])].sort().join('');
  const cor=[...q.correct].sort().join('');
  return sel===cor;
}
function checkAnswer(q){
  Q.checked[q.num]=true;
  recordResult(q.num, isCorrect(q));
  updateMastery();
  renderQuestion();
}
function showFeedback(q){
  const fb=$('#feedback'); if(!fb) return;
  const ok=isCorrect(q);
  fb.className='feedback show '+(ok?'good':'poor');
  fb.innerHTML = ok
    ? '✓ Correct'
    : `✗ Not quite — correct answer${q.correct.length>1?'s':''}: <b>${q.correct.join(', ')}</b>`;
}
function advance(){
  const q=curQ();
  if(Q.mode==='practice' && !Q.checked[q.num] && (Q.sel[q.num]||[]).length){
    // auto-grade before moving so it counts
    checkAnswer(q);
    return;
  }
  if(Q.idx===Q.pool.length-1){
    if(Q.mode==='exam') finishExam(); else finishPractice();
  } else { Q.idx++; renderQuestion(); }
}
function leaveQuiz(){ clearInterval(timerInt); renderMenu(); }

function finishPractice(){
  let right=0, ans=0;
  Q.pool.forEach(q=>{ if(Q.checked[q.num]){ans++; if(isCorrect(q)) right++;} });
  renderResult({right, total:ans, pool:Q.pool, label:'Practice complete'});
}
function finishExam(){
  clearInterval(timerInt);
  // grade everything (unanswered = wrong) and record
  Q.pool.forEach(q=>{ Q.checked[q.num]=true; recordResult(q.num, isCorrect(q)); });
  updateMastery();
  let right=Q.pool.filter(isCorrect).length;
  renderResult({right, total:Q.pool.length, pool:Q.pool, label:'Exam submitted', exam:true});
}

/* ---------- results ---------- */
function renderResult({right,total,pool,label,exam}){
  const pct = total? Math.round(right/total*100) : 0;
  const pass = pct>=PASS_PCT;
  const wrongQs = pool.filter(q=>Q.checked[q.num] && !isCorrect(q));
  app.innerHTML=`
    <div class="result">
      <span class="eyebrow">${label}</span>
      <div class="score ${exam?(pass?'pass':'fail'):''}">${pct}%</div>
      <div class="verdict">${right} of ${total} correct${exam?` · pass mark is <b>${PASS_PCT}%</b> — <b>${pass?'PASS':'below pass'}</b>`:''}</div>
      <div class="breakdown">
        <div><b>${right}</b>correct</div>
        <div><b>${total-right}</b>missed</div>
        <div><b>${masteredCount()}</b>/${TOTAL} mastered</div>
      </div>
      <div class="navrow" style="justify-content:center">
        <button class="btn" id="again">Back to menu</button>
        ${wrongQs.length?`<button class="btn ghost" id="reviewwrong">Review ${wrongQs.length} missed</button>`:''}
      </div>
    </div>
    <div id="wronglist"></div>
  `;
  $('#again').onclick=renderMenu;
  const rw=$('#reviewwrong');
  if(rw) rw.onclick=()=>{
    $('#wronglist').innerHTML = '<div style="height:18px"></div>' + wrongQs.map(browseCard).join('');
  };
}

/* ---------- browse ---------- */
function browseCard(q){
  return `<div class="browseq">
    <span class="qn">QUESTION ${q.num}${q.correct.length>1?' · SELECT '+q.correct.length:''}</span>
    <div class="bq">${esc(q.q)}</div>
    ${q.answers.map(a=>`<div class="ba ${a.correct?'right':''}"><span class="bk">${a.letter}</span><span>${esc(a.text)}</span></div>`).join('')}
  </div>`;
}
function renderBrowse(){
  app.innerHTML=`
    <div class="quizbar">
      <button class="btn ghost" id="quit" style="padding:6px 12px">‹ Menu</button>
      <span class="counter" id="bcount"></span>
    </div>
    <input class="search" id="search" placeholder="Search questions and answers… (or type a number)">
    <div id="blist"></div>
  `;
  $('#quit').onclick=renderMenu;
  const inp=$('#search'), list=$('#blist'), cnt=$('#bcount');
  function draw(){
    const term=inp.value.trim().toLowerCase();
    let res=QUESTIONS;
    if(term){
      if(/^\d+$/.test(term)) res=QUESTIONS.filter(q=>String(q.num)===term);
      else res=QUESTIONS.filter(q=>{
        if(q.q.toLowerCase().includes(term)) return true;
        return q.answers.some(a=>a.text.toLowerCase().includes(term));
      });
    }
    cnt.textContent=`${res.length} question${res.length!==1?'s':''}`;
    list.innerHTML = res.length? res.map(browseCard).join('') : '<div class="empty">No matches.</div>';
  }
  inp.oninput=draw; draw();
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(!Q || app.querySelector('.qcard')==null) return;
  if(e.target.tagName==='INPUT') return;
  const q=curQ(); if(!q) return;
  const isMulti=q.correct.length>1;
  const k=e.key.toUpperCase();
  const letters=q.answers.map(a=>a.letter);
  if(letters.includes(k) && !Q.checked[q.num]){ toggle(q,k,isMulti); e.preventDefault(); return; }
  const numMap={'1':'A','2':'B','3':'C','4':'D','5':'E'};
  if(numMap[k] && letters.includes(numMap[k]) && !Q.checked[q.num]){ toggle(q,numMap[k],isMulti); e.preventDefault(); return; }
  if(e.key==='Enter'){ 
    const chk=$('#check');
    if(chk && !chk.disabled){ checkAnswer(q); } else { advance(); }
    e.preventDefault();
  }
  if(e.key==='ArrowRight'){ advance(); e.preventDefault(); }
  if(e.key==='ArrowLeft' && Q.idx>0){ Q.idx--; renderQuestion(); e.preventDefault(); }
  if(k==='F'){ const f=$('#flag'); if(f) f.click(); e.preventDefault(); }
});

/* ---------- boot ---------- */
(async()=>{ await loadStore(); renderMenu(); })();
</script>
